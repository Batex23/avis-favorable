<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Avis Favorable ! Le jeu télé de la prévention incendie, en équipe, à projeter.">
<title>Avis Favorable !</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Plateau de jeu télé néon : un écran plein cadre, projeté. Panneaux sombres cerclés de néon, rose = équipe 1, cyan = équipe 2. */
:root{
  --bg:#07070F; --panel:#0E0E1E; --panel2:#15152B; --line:#2C2C4C;
  --fg:#EDEBFF; --muted:#A9A6CF;
  --pink:#FF2E88; --cyan:#2EF2FF; --amber:#FFC93C; --violet:#A47BFF; --lime:#B6FF3B; --bad:#FF5A5A;
  --f-title:'Monoton', 'Chakra Petch', system-ui, sans-serif;
  --f-ui:'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;overflow:hidden;
  background-image:linear-gradient(rgba(46,242,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(46,242,255,.06) 1px,transparent 1px);background-size:40px 40px}
#app{height:100%;box-sizing:border-box;padding-block:clamp(12px,2.2vh,28px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:clamp(10px,2vh,22px);overflow-y:auto}
button,input,select{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
h1,h2,h3,p{margin:0}
h2{text-wrap:balance}

/* Titres néon */
.neon-p{color:#fff;text-shadow:0 0 6px var(--pink),0 0 22px var(--pink),0 0 44px var(--pink)}
.neon-c{color:#fff;text-shadow:0 0 6px var(--cyan),0 0 20px var(--cyan),0 0 40px var(--cyan)}
.logo{font-family:var(--f-title);font-weight:400;letter-spacing:.05em;line-height:1;text-align:center}
.eyebrow{font-size:clamp(12px,1.4vw,15px);font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan)}

/* Barre du haut */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top .mini{font-family:var(--f-title);font-size:clamp(18px,2.2vw,26px)}
.top .tools{display:flex;gap:8px;flex-wrap:wrap}

/* Boutons façon menu de console */
.btn{appearance:none;border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 20px;font-size:clamp(15px,1.6vw,19px);font-weight:700;cursor:pointer;transition:transform .12s, box-shadow .12s, border-color .12s;min-height:48px}
.btn:hover{transform:translateY(-2px) scale(1.02);border-color:var(--cyan);box-shadow:0 0 16px rgba(46,242,255,.35)}
.btn:active{transform:scale(.97)}
.btn.big{font-size:clamp(18px,2.4vw,28px);padding:18px 30px;border-radius:22px;min-height:64px}
.btn.pink{border-color:var(--pink);box-shadow:0 0 14px rgba(255,46,136,.35)}
.btn.pink:hover{box-shadow:0 0 22px rgba(255,46,136,.6)}
.btn.cyan{border-color:var(--cyan);box-shadow:0 0 14px rgba(46,242,255,.3)}
.btn.ghost{background:transparent;border-color:var(--line);font-weight:600;font-size:14px;padding:8px 14px;min-height:44px;border-radius:12px}
.btn.ok{border-color:var(--lime);color:var(--lime)}
.btn.no{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;pointer-events:none}

.panel{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(14px,2vw,24px)}
.glow-p{border-color:var(--pink);box-shadow:0 0 18px rgba(255,46,136,.4),inset 0 0 18px rgba(255,46,136,.18)}
.glow-c{border-color:var(--cyan);box-shadow:0 0 18px rgba(46,242,255,.35),inset 0 0 18px rgba(46,242,255,.15)}
.muted{color:var(--muted)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.grow{flex:1 1 auto;min-height:0}
.row{display:flex;gap:clamp(10px,1.6vw,20px);flex-wrap:wrap;align-items:center}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:1.8em;height:1.8em;padding:0 .4em;border:2px solid currentColor;border-radius:8px;font-weight:700;font-size:.9em}

/* Écran titre */
.title-screen .logo-a{font-size:clamp(64px,12vw,170px)}
.title-screen .logo-b{font-size:clamp(34px,6.2vw,88px)}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(820px,100%)}
@media (max-width:640px){.menu{grid-template-columns:1fr}}
.menu .btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.menu .btn small{font-size:14px;font-weight:500;color:var(--muted)}

/* Équipes */
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2vw,24px)}
@media (max-width:720px){.teams{grid-template-columns:1fr}}
.team-card{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.team-card input[type=text]{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:clamp(18px,2vw,24px);font-weight:700;text-align:center;width:min(320px,100%)}
.emblems{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.emblem{width:56px;height:56px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.emblem[aria-pressed=true]{border-color:currentColor;box-shadow:0 0 12px currentColor}
.buzzcheck{font-size:15px;font-weight:600;padding:8px 14px;border-radius:999px;border:2px dashed var(--line);color:var(--muted)}
.buzzcheck.on{border-style:solid;border-color:var(--lime);color:var(--lime)}
.stepper{display:inline-flex;align-items:center;gap:10px;font-weight:700}
.stepper button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);font-size:22px;font-weight:700;cursor:pointer}

/* Scores */
.scorebar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.score{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:18px;padding:8px 14px;background:var(--panel)}
.score .name{font-weight:700;font-size:clamp(15px,1.6vw,20px);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .pts{margin-left:auto;font-size:clamp(24px,3vw,40px);font-weight:700;font-variant-numeric:tabular-nums}
.score.t0{border-color:var(--pink)} .score.t0 .pts{color:var(--pink)}
.score.t1{border-color:var(--cyan)} .score.t1 .pts{color:var(--cyan)}
.score.flash{animation:flash .5s 2}
@keyframes flash{50%{background:var(--panel2);transform:scale(1.03)}}

/* Plateau */
.board{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:24px 4px 10px}
.node{position:relative;flex:1 0 150px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.node::before{content:"";position:absolute;top:44px;left:0;right:0;height:6px;background:var(--line);z-index:0}
.node:first-child::before{left:50%} .node:last-child::before{right:50%}
.node.done::before{background:var(--lime)}
.node .disc{position:relative;z-index:1;width:92px;height:92px;border-radius:50%;background:var(--panel);border:4px solid var(--line);display:flex;align-items:center;justify-content:center}
.node.done .disc{border-color:var(--lime);box-shadow:0 0 14px rgba(182,255,59,.45)}
.node.now .disc{border-color:var(--amber);box-shadow:0 0 22px rgba(255,201,60,.65);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.node .lbl{font-weight:700;font-size:clamp(14px,1.4vw,17px)}
.node .sub{font-size:13px;color:var(--muted)}
.node.now .lbl{color:var(--amber)}

/* Comment jouer */
.howto{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(14px,2vw,26px);width:min(1100px,100%)}
@media (max-width:760px){.howto{grid-template-columns:1fr}}
.howto ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:10px;font-size:clamp(16px,1.7vw,21px);line-height:1.4}
.ctl{display:flex;align-items:center;gap:12px;font-size:clamp(15px,1.5vw,19px);font-weight:600}
.ctl-list{display:flex;flex-direction:column;gap:14px}

/* Compte à rebours */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,7,15,.78);z-index:50;pointer-events:none}
#overlay .cd{font-family:var(--f-title);font-size:clamp(90px,20vw,260px);animation:pop .7s ease-out both}
@keyframes pop{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}

/* Question */
.qcard{display:flex;flex-direction:column;gap:clamp(10px,1.6vh,18px)}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:clamp(13px,1.3vw,16px);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.qtext{font-size:clamp(22px,3vw,42px);font-weight:700;line-height:1.2;text-wrap:balance}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(28px,3.4vw,48px);color:var(--amber)}
.timer.low{color:var(--bad);animation:flash .5s infinite}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.4vw,16px)}
@media (max-width:640px){.answers{grid-template-columns:1fr}}
.ans{display:flex;align-items:center;gap:14px;border-radius:18px;padding:clamp(10px,1.6vh,18px) 18px;border:3px solid var(--c);background:var(--panel);font-size:clamp(17px,2vw,26px);font-weight:600;transition:opacity .3s, transform .3s, box-shadow .3s}
.ans .let{flex:0 0 auto;width:1.7em;height:1.7em;border-radius:10px;background:var(--c);color:#07070F;display:flex;align-items:center;justify-content:center;font-weight:700}
.ans.good{box-shadow:0 0 28px var(--c);transform:scale(1.03)}
.ans.dim{opacity:.25}
.c0{--c:var(--pink)} .c1{--c:var(--cyan)} .c2{--c:var(--amber)} .c3{--c:var(--violet)}
.expl{font-size:clamp(14px,1.5vw,18px);color:var(--muted);line-height:1.4}

/* 4 coins */
.room{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.4vw,16px)}
.corner{border-radius:20px;border:3px solid var(--c);padding:clamp(12px,2vh,22px);display:flex;flex-direction:column;gap:6px;background:var(--panel);transition:opacity .3s, box-shadow .3s}
.corner .where{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.corner .txt{font-size:clamp(17px,2.1vw,27px);font-weight:700}
.corner.good{box-shadow:0 0 30px var(--c)} .corner.dim{opacity:.25}
.count{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.count{grid-template-columns:1fr}}

/* Money Drop */
.md{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.md{grid-template-columns:1fr}}
.md-team{display:flex;flex-direction:column;gap:10px}
.md-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:clamp(15px,1.6vw,20px)}
.md-slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{border:3px solid var(--c);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel2);overflow:hidden}
.slot .n{font-size:clamp(22px,2.6vw,34px);font-weight:700;font-variant-numeric:tabular-nums}
.slot .pm{display:flex;gap:4px}
.slot .pm button{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--panel);font-size:20px;font-weight:700;cursor:pointer}
.slot.drop .n{animation:drop .9s ease-in forwards}
.slot.drop{opacity:.35}
@keyframes drop{to{transform:translateY(120px);opacity:0}}
.chips{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:14px}
.chip{width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber)}

/* Tabou */
.tabou-card{width:min(440px,100%);border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.tabou-word{font-size:clamp(30px,4vw,54px);font-weight:700;line-height:1.05}
.forbid{display:flex;flex-direction:column;gap:8px;width:100%}
.forbid span{border-radius:12px;padding:8px;background:var(--panel2);border:2px solid var(--bad);font-size:clamp(17px,1.9vw,24px);font-weight:600;text-decoration:line-through;text-decoration-color:var(--bad)}

/* Finale */
.duel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.lane{display:flex;align-items:center;gap:12px;border-radius:18px;border:3px solid var(--c);padding:10px 14px;background:var(--panel)}
.lane.t0{--c:var(--pink)} .lane.t1{--c:var(--cyan)}
.pips{display:flex;gap:6px;margin-left:auto}
.pip{width:clamp(18px,2.2vw,28px);height:clamp(18px,2.2vw,28px);border-radius:6px;border:2px solid var(--c)}
.pip.on{background:var(--c);box-shadow:0 0 10px var(--c)}
.lane.buzz{animation:flash .35s 3;box-shadow:0 0 30px var(--c)}
.hand{font-size:clamp(20px,2.4vw,32px);font-weight:700;text-align:center;min-height:1.4em}
.stamp{font-family:'Chakra Petch',sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(46px,9vw,130px);line-height:.95;color:var(--pink);border:10px double var(--pink);border-radius:16px;padding:.15em .35em;transform:rotate(-8deg);text-shadow:0 0 18px rgba(255,46,136,.6);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both;text-align:center}
@keyframes stamp{from{transform:rotate(-8deg) scale(3);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}

/* Résultats */
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:min(900px,100%)}
@media (max-width:640px){.res{grid-template-columns:1fr}}
.res .panel{display:flex;flex-direction:column;align-items:center;gap:10px}
.res .gain{font-size:clamp(40px,6vw,80px);font-weight:700;font-variant-numeric:tabular-nums}
.bounce{animation:bounce 1s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}

/* Régie */
#regie{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:2px solid var(--amber);z-index:40;box-sizing:border-box;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.6)}
#regie h3{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
#regie .ans-key{font-size:22px;font-weight:700;color:var(--lime)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px;align-items:center}

/* Banque / composition */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.form-grid{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--panel2);cursor:pointer;font-weight:600}
.opt input{width:22px;height:22px;accent-color:var(--pink)}
.opt.soon{opacity:.45;cursor:default}
.opt .d{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;background:var(--panel2);cursor:pointer;min-height:40px}
.tag[aria-pressed=true]{border-color:var(--cyan);color:var(--cyan)}
select{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
th{color:var(--muted);font-weight:600}
.scroll{overflow:auto;max-height:44vh}
.note{font-size:14px;color:var(--muted);line-height:1.45}

/* Désamorçage : tableau SSI */
.ssi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(10px,1.6vw,20px)}
@media (max-width:860px){.ssi{grid-template-columns:1fr}}
.ssi-col{display:flex;flex-direction:column;gap:clamp(10px,1.6vh,16px);min-width:0}
.ssi-box{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ssi-box h3{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.lcd{background:#06200E;border:3px solid #123A1C;border-radius:10px;padding:12px 14px;font-family:'Courier New',ui-monospace,monospace;color:#7CFF8A;text-shadow:0 0 6px rgba(124,255,138,.6);font-size:clamp(20px,2.4vw,32px);font-weight:700;line-height:1.25;letter-spacing:.06em}
.lcd small{display:block;font-size:.55em;letter-spacing:.1em;opacity:.85}
.leds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.ledrow{display:flex;align-items:center;gap:10px;font-size:clamp(14px,1.4vw,17px);font-weight:600}
.led{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:#26263E;border:2px solid #3A3A5C}
.led.red{background:#FF3B3B;border-color:#FF8080;box-shadow:0 0 12px #FF3B3B}
.led.amber{background:#FFB020;border-color:#FFD27A;box-shadow:0 0 12px #FFB020}
.led.yellow{background:#FFE14D;border-color:#FFF0A0;box-shadow:0 0 12px #FFE14D}
.led.green{background:#3BE37A;border-color:#9AF5BC;box-shadow:0 0 10px #3BE37A}
.blink{animation:blink .8s steps(1) infinite}
@keyframes blink{50%{background:#26263E;box-shadow:none;border-color:#3A3A5C}}
.radio{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:clamp(16px,1.8vw,22px);font-weight:600;min-height:2.6em;display:flex;align-items:center;gap:12px}
.radio.on{border-style:solid;border-color:var(--amber);color:var(--amber)}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.acts{grid-template-columns:1fr}}
.act{appearance:none;text-align:left;border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:clamp(14px,1.4vw,17px);font-weight:700;cursor:pointer;min-height:48px;transition:transform .1s,border-color .1s}
.act:hover{border-color:var(--cyan);transform:translateY(-1px)}
.act.done{border-color:var(--lime);color:var(--lime)}
.act.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.act[disabled]{opacity:.45;pointer-events:none}
.strikes{display:flex;gap:6px;align-items:center}
.strike{width:26px;height:26px;border-radius:8px;border:2px solid var(--bad)}
.strike.on{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.guide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.guide{grid-template-columns:1fr}}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;line-height:0}
.qr img,.qr canvas{display:block}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<div id="app" aria-live="polite"></div>
<div id="overlay" hidden><div class="cd neon-p" id="cdtext"></div></div>
<aside id="regie" hidden aria-label="Régie de l'animateur"></aside>

<script>
"use strict";
/* ============ DONNÉES ============ */
/* Questions de démonstration (bonne réponse en premier, mélangée à l'affichage). À faire valider par un PRV2. */

let AC = null;
function tone(f, d=.15, type="square", v=.08, when=0){
  if(!SOUND) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
  }catch(e){}
}

function stopTimer(){ if(TIMER){ clearInterval(TIMER); TIMER = null; } }
function startTimer(sec, onEnd){
  stopTimer(); let left = sec; const el = () => $("#timer");
  const draw = () => { const e = el(); if(e){ e.textContent = left + " s"; e.classList.toggle("low", left <= 5); } };
  draw();
  TIMER = setInterval(()=>{ left--; if(left <= 5 && left > 0) SFX.tick(); draw(); if(left <= 0){ stopTimer(); onEnd && onEnd(); } }, 1000);
  return { add:(s)=>{ left += s; draw(); } };
}
function countdown(done){
  const ov = $("#overlay"), tx = $("#cdtext"); ov.hidden = false;
  const seq = ["Prêts ?","3","2","1","GO !"]; let i = 0;
  const step = () => {
    if(i >= seq.length){ ov.hidden = true; done(); return; }
    tx.textContent = seq[i]; tx.style.animation = "none"; void tx.offsetWidth; tx.style.animation = "";
    tx.style.fontSize = i === 0 ? "clamp(60px,11vw,150px)" : "";
    i === seq.length-1 ? SFX.go() : SFX.tick(); i++;
    setTimeout(step, i === 1 ? 1000 : 700);
  };
  step();
}
function pickQ(n, sortByLevel, opt){
  opt = opt || {};
  let pool = BANK.filter(q => !G.used.includes(q.id));
  if(opt.minOpts){ const p = pool.filter(q => q.o.length >= opt.minOpts); if(p.length >= n) pool = p; }
  if(G.themes.length) pool = pool.filter(q => G.themes.includes(q.t));
  const lv = {mix:[1,2,3], decouverte:[1], ca:[1,2], prv2:[2,3]}[G.level] || [1,2,3];
  let p2 = opt.allLevels ? pool : pool.filter(q => lv.includes(+q.n || 1));
  if(p2.length < n) p2 = pool;
  if(p2.length < n){ G.used = []; p2 = BANK.slice(); }
  let out = shuffle(p2).slice(0, n);
  if(sortByLevel) out.sort((a,b)=>(+a.n||1)-(+b.n||1));
  out.forEach(q => G.used.push(q.id));
  return out.map(q => { const idx = shuffle([0,1,2,3].slice(0, q.o.length)); return {...q, o: idx.map(i=>q.o[i]), c: idx.indexOf(q.c)}; });
}

    </div>
    <div class="panel" style="display:flex;flex-direction:column;gap:12px">
      <h2 style="font-size:24px">Importer votre base</h2>
      <p class="note">Fichier CSV (séparateur ; ou ,) avec une ligne d'en-têtes. Colonnes reconnues : <strong>Thème</strong>, <strong>Question</strong>, <strong>A</strong>, <strong>B</strong>, <strong>C</strong>, <strong>D</strong> (ou Réponse 1 à 4), <strong>Bonne réponse</strong> (lettre, numéro ou texte), <strong>Explication</strong>, <strong>Niveau</strong> (1 à 3). L'export CSV de la Tournée du Préventionniste convient s'il contient ces colonnes.</p>
      <label class="btn cyan" for="csvfile" style="text-align:center">Choisir un fichier CSV</label>
      <input type="file" id="csvfile" accept=".csv,text/csv" hidden>
      <p id="impmsg" class="note" role="status"></p>
      <button class="btn ghost" data-act="resetbank">${TOURNEE ? "Revenir à la base de la Tournée" : "Revenir aux questions de démonstration"}</button>
    </div>
  </div>
  <div><button class="btn" data-act="home">Retour</button></div>`);
  $("#csvfile").addEventListener("change", importCSV);

function parseCSV(txt){
  txt = txt.replace(/^﻿/, "");
  const first = txt.split(/\r?\n/)[0] || ""; const sep = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ";" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for(let i=0;i<txt.length;i++){
    const ch = txt[i];
    if(q){ if(ch === '"'){ if(txt[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"') q = true;
    else if(ch === sep){ row.push(cell); cell = ""; }
    else if(ch === "\n" || ch === "\r"){ if(ch === "\r" && txt[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function importCSV(ev){
  const f = ev.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const rows = parseCSV(String(rd.result)); const msg = $("#impmsg");
    if(rows.length < 2){ msg.textContent = "Le fichier est vide ou n'a pas de ligne d'en-têtes."; return; }
    const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
    const H = rows[0].map(norm); const find = re => H.findIndex(h => re.test(h));
    const iq = find(/question|intitule|enonce/), it = find(/theme|categ/), ie = find(/expli|justif|commentaire/), inv = find(/niveau|level/), ic = find(/bonne|correct|solution/);
    let io = ["a","b","c","d"].map((l,k) => H.findIndex(h => h === l || h === "reponse "+l || h === "reponse"+(k+1) || h === "reponse "+(k+1) || h === "choix "+(k+1) || h === "option "+(k+1)));
    if(iq < 0 || ic < 0 || io.filter(x=>x>=0).length < 2){ msg.textContent = "Colonnes introuvables. Il faut au moins Question, deux réponses (A, B…) et Bonne réponse."; return; }
    const out = []; let skip = 0;
    rows.slice(1).forEach((r,k) => {
      const opts = io.filter(x=>x>=0).map(x => (r[x]||"").trim()).filter(Boolean);
      const qs = (r[iq]||"").trim(); const raw = (r[ic]||"").trim();
      let c = -1;
      if(/^[a-d]$/i.test(raw)) c = "abcd".indexOf(raw.toLowerCase());
      else if(/^[1-4]$/.test(raw)) c = +raw - 1;
      else c = opts.findIndex(o => norm(o) === norm(raw));
      if(!qs || opts.length < 2 || c < 0 || c >= opts.length){ skip++; return; }
      out.push({id:"i"+k, t:(it>=0 && r[it]?.trim()) || "Général", n:Math.min(3, Math.max(1, parseInt(inv>=0 ? r[inv] : 1) || 1)), q:qs, o:opts, c, e:(ie>=0 ? r[ie] : "") || ""});
    });
    if(!out.length){ msg.textContent = "Aucune question valide trouvée (" + skip + " lignes ignorées)."; return; }
    BANK = out; BANK_SRC = "import"; G.used = []; G.themes = [];
    try{ localStorage.setItem("af-bank", JSON.stringify(out)); }catch(e){}
    screenBank(); $("#impmsg").textContent = out.length + " questions importées" + (skip ? ", " + skip + " lignes ignorées (réponse manquante ou illisible)." : ".");
  };
  rd.readAsText(f, "utf-8");
}

      <div class="qmeta"><span>${esc(q.t)}</span><span class="timer" id="timer"></span></div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="answers">${q.o.map((o,j)=>`<div class="ans c${j}" id="an${j}"><span class="let">${LETTERS[j]}</span><span>${esc(o)}</span></div>`).join("")}</div>
    </div>
    <div class="md">${[0,1].map(t=>`<div class="panel md-team ${t?"glow-c":"glow-p"}">
      <div class="md-head"><span>${esc(G.teams[t].name)}</span><span>À placer : <span id="left${t}" style="color:var(--amber)">${bank[t]}</span></span></div>
      <div class="md-slots" style="grid-template-columns:repeat(${q.o.length},minmax(0,1fr))">${q.o.map((_,j)=>`<div class="slot c${j}" id="sl${t}${j}"><span class="let" style="font-weight:700;color:var(--c)">${LETTERS[j]}</span><span class="n" id="n${t}${j}">0</span><div class="chips" id="ch${t}${j}"></div><span class="pm"><button aria-label="Retirer un jeton sur ${LETTERS[j]}" data-bet="${t}${j}-">−</button><button aria-label="Ajouter un jeton sur ${LETTERS[j]}" data-bet="${t}${j}+">+</button></span></div>`).join("")}</div>
    </div>`).join("")}</div>
    <div class="row" style="justify-content:center"><button class="btn big pink" id="op">Ouvrir les trappes <span class="kbd">Espace</span></button><span class="muted" id="warn"></span></div>`);
    const draw = (t) => { const s = bet[t].reduce((a,b)=>a+b,0); $("#left"+t).textContent = bank[t] - s; bet[t].forEach((v,j)=>{ $("#n"+t+j).textContent = v; $("#ch"+t+j).innerHTML = '<span class="chip"></span>'.repeat(v); }); };
    document.querySelectorAll("[data-bet]").forEach(b => b.onclick = () => {
      if(opened) return; const t = +b.dataset.bet[0], j = +b.dataset.bet[1], up = b.dataset.bet[2] === "+";
      const s = bet[t].reduce((a,x)=>a+x,0);
      if(up && s >= bank[t]) return; if(!up && bet[t][j] === 0) return;
      if(up && bet[t].filter((v,x)=>x!==j && v===0).length === 0 && bet[t][j] === 0){ $("#warn").textContent = "Au moins une trappe doit rester vide."; SFX.bad(); return; }
      bet[t][j] += up ? 1 : -1; $("#warn").textContent = ""; SFX.blip(); draw(t);
    });
    $("#op").onclick = () => opened ? next() : open();
    startTimer(45, () => { SFX.buzz(0); $("#warn").textContent = "Temps écoulé ! Les jetons non placés seront perdus."; });
    function open(){
      opened = true; stopTimer(); SFX.drop();
      q.o.forEach((_,j)=>$("#an"+j).classList.add(j===q.c?"good":"dim"));
      [0,1].forEach(t => { q.o.forEach((_,j) => { if(j < q.o.length && j !== q.c) $("#sl"+t+j).classList.add("drop"); }); bank[t] = bet[t][q.c]; $("#left"+t).textContent = bank[t] + " jetons sauvés"; });
      setTimeout(SFX.good, 700);
      $("#op").innerHTML = (i+1 < qs.length ? "Question suivante" : "Encaisser les jetons") + ' <span class="kbd">Espace</span>';
      if(q.e) $("#warn").textContent = q.e;
      refreshRegie();
    }
    function next(){
      i++;
      if(i < qs.length && (bank[0] || bank[1])) show();
      else { addPts(0, bank[0]); addPts(1, bank[1]); endGame(before); }
    }
    refreshRegie();
  };
  show();
};

/* ---- Désamorçage ---- */
const RADIO = {
  feu:["Fumée noire sous la porte, forte odeur de brûlé.","Début de feu sur une poubelle, ça prend vite.","Flammes visibles au faux plafond.","Fumée qui sort d'une armoire électrique."],
  faux:{ZD2:"Rien de grave : c'est la machine à fumée du spectacle.",ZD3:"Rien de grave : c'est la machine à fumée du spectacle.",ZD4:"Rien de grave : vapeur de cuisson, la hotte était coupée.",ZD6:"Rien de grave : vapeur de douche dans une chambre.",ZD7:"Rien de grave : vapeur de douche dans une chambre.", _:"Rien constaté : ni fumée, ni odeur, ni chaleur."}
};
function makeAlarm(){
  const z = ZONES[Math.floor(Math.random()*ZONES.length)];
  const type = Math.random() < .72 ? "F" : "D";
  const real = Math.random() < .6;
  const das = type === "F" && Math.random() < .5;
  const num = String(Math.floor(Math.random()*90)+10).padStart(3,"0");
  const radio = real ? shuffle(RADIO.feu)[0] : (RADIO.faux[z.id] || RADIO.faux._);
  const groups = type === "D" ? [["acq"],["maint","ronde"],["reg"]] : [["acq"],["agent"]];
  return {z, type, real, das, code:`${type}-${z.id}-${num}`, radio, groups};
}
RUN.desamorcage = function(){
  const before = G.teams.map(t=>t.pts);
  const order = [0,1,0,1]; let r = 0;
  const intro = () => {
    if(r >= order.length) return endGame(before);
    const t = order[r];
    CUR = { onKey:(k)=>{ if(k===" "||k==="Enter") play(); } };
    render(`${topbar("Désamorçage · alarme " + (r+1) + " / " + order.length)}${scorebar()}
    <div class="grow center" style="gap:20px">
      <h2 class="${TCLS[t]}" style="font-size:clamp(28px,3.8vw,50px)">${esc(G.teams[t].name)} au PC sécurité</h2>
      <p class="muted" style="font-size:clamp(17px,1.8vw,22px);max-width:56ch;line-height:1.45">${r < 2 ? "Désignez un opérateur." : "Changez d'opérateur."} Il s'assoit face à l'écran. Les autres se retournent, manuel en main.</p>
      <button class="btn big pink" id="dgo">Déclencher l'alarme <span class="kbd">Espace</span></button>
    </div>`);
    $("#dgo").onclick = play;
  };
  const play = () => {
    const t = order[r]; const A = makeAlarm();
    let gi = 0, left = A.groups[0].slice(), strikes = 0, acq = false, evac = false, dasOk = !A.das, waiting = false, over = false, radio = "", guiding = false, rearmed = false;
    const hint = () => over ? "Alarme terminée." : waiting ? "Attente du rapport radio." : "Actions attendues : " + left.map(a=>ACT_NAME[a]).join(" + ") + (A.type==="F" && gi>=2 && A.real ? " · Zone " + A.z.id + " = " + A.z.acces : "");
    CUR = { regieHint:hint };
    const leds = () => {
      const F = A.type === "F";
      const L = [
        ["Feu · alarme restreinte", F ? "red" : "", F && !acq],
        ["Temporisation en cours", F && !evac && !rearmed ? "amber" : "", true],
        ["Évacuation générale", evac ? "red" : "", false],
        ["DAS en position de sécurité", A.das && !dasOk ? "amber" : "green", A.das && !dasOk],
        ["Dérangement", A.type === "D" ? "yellow" : "", !acq],
        ["Sous tension", "green", false]
      ];
      return L.map(([n,c,b])=>`<div class="ledrow"><span class="led ${c} ${c && b ? "blink" : ""}" aria-hidden="true"></span><span>${n}${c?"":" · éteint"}</span></div>`).join("");
    };
    const draw = () => {
      const rest = over ? "" : `
        <div class="ssi-box"><h3>Commandes</h3><div class="acts">${ACTIONS.map(([k,n])=>`<button class="act" data-a="${k}" ${waiting||over?"disabled":""}>${n}</button>`).join("")}</div>
        ${guiding ? `<div class="ssi-box" style="border-color:var(--cyan)"><h3>Où guider les secours ?</h3><div class="guide">${A.choices.map((c,i)=>`<button class="act" data-g="${i}">${esc(c)}</button>`).join("")}</div></div>` : ""}</div>`;
      $("#dz").innerHTML = `
      <div class="ssi">
        <div class="ssi-col">
          <div class="ssi-box"><h3>ECS · tableau de signalisation</h3><div class="lcd">${A.code}<small>${acq ? "BUZZER ACQUITTÉ" : "ATTENTE ACQUITTEMENT"}</small></div></div>
          <div class="ssi-box"><h3>CMSI · voyants</h3><div class="leds">${leds()}</div></div>
          <div class="radio ${radio?"on":""}" role="status">${radio ? "Radio de l'agent : « " + esc(radio) + " »" : (waiting ? "Agent en route vers la zone…" : "Radio : silence")}</div>
        </div>
        <div class="ssi-col">${rest}</div>
      </div>`;
      $("#strk").innerHTML = [0,1,2].map(i=>`<span class="strike ${i<strikes?"on":""}"></span>`).join("");
      document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => press(b.dataset.a, b));
      document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => pick(+b.dataset.g, b));
      refreshRegie();
    };
    render(`${topbar("Désamorçage · " + G.teams[t].name)}
    <div class="row" style="justify-content:space-between"><span class="timer" id="timer"></span><span class="strikes" aria-label="Fausses manœuvres"><span class="muted" style="margin-right:6px">Fausses manœuvres</span><span class="strikes" id="strk"></span></span></div>
    <div id="dz" class="grow"></div>
    <div id="dres"></div>`);
    draw();
    startTimer(90, () => finish(false, "Temps écoulé"));
    function fault(btn){
      strikes++; SFX.bad(); if(btn){ btn.classList.remove("err"); void btn.offsetWidth; btn.classList.add("err"); }
      if(strikes >= 3){ draw(); return finish(false, "Trois fausses manœuvres"); }
      draw();
    }
    function advance(){
      if(left.length) return;
      gi++;
      if(gi < A.groups.length){ left = A.groups[gi].slice(); return; }
      finish(true);
    }
    function press(a, btn){
      if(over || waiting) return;
      if(!left.includes(a)) return fault(btn);
      if(a === "guide"){ guiding = true; A.choices = shuffle([A.z.acces, ...shuffle(ZONES.filter(z=>z.id!==A.z.id)).slice(0,3).map(z=>z.acces)]); SFX.blip(); return draw(); }
      left = left.filter(x => x !== a); SFX.blip();
      if(a === "acq") acq = true;
      if(a === "evac"){ evac = true; SFX.buzz(0); }
      if(a === "das") dasOk = true;
      if(a === "rearm"){ rearmed = true; acq = true; }
      if(a === "agent"){
        waiting = true; draw();
        setTimeout(() => {
          if(over) return;
          waiting = false; radio = A.radio; SFX.tick();
          A.groups.push(...(A.real ? [["evac","appel", ...(A.das ? ["das"] : [])],["guide"]] : [["rearm"],["reg"]]));
          advance(); draw();
        }, 2600);
        return;
      }
      advance(); if(!over) draw();
    }
    function pick(i, btn){
      if(over) return;
      if(A.choices[i] !== A.z.acces) return fault(btn);
      guiding = false; left = []; SFX.good(); advance();
    }
    function finish(ok, why){
      if(over) return; over = true; stopTimer();
      const pts = ok ? 3 + (strikes === 0 ? 1 : 0) : 0;
      if(pts) addPts(t, pts);
      ok ? SFX.fanfare() : SFX.drop();
      draw();
      const expl = A.type === "D" ? `Dérangement en ${A.z.id} (${esc(A.z.nom)}) : acquitter, appeler le mainteneur et lancer une ronde, puis noter au registre.`
        : A.real ? `Feu confirmé en ${A.z.id} (${esc(A.z.nom)}) : acquitter, levée de doute, évacuation générale et appel des secours${A.das ? ", commande des DAS" : ""}, puis guidage par : ${esc(A.z.acces)}.`
        : `Fausse alarme en ${A.z.id} (${esc(A.z.nom)}) : acquitter, levée de doute, réarmer, puis noter au registre.`;
      $("#dres").innerHTML = `<div class="panel ${ok?"glow-c":"glow-p"} center" style="gap:12px;margin-top:12px">
        <h3 style="font-size:clamp(24px,3vw,38px)" class="${ok?"neon-c":"neon-p"}">${ok ? "Alarme maîtrisée ! +" + pts : esc(why) + " : alarme ratée"}</h3>
        <p class="expl" style="max-width:70ch">${expl}</p>
        <button class="btn big cyan" id="dnx">${r+1 < order.length ? "Alarme suivante" : "Fin de l'épreuve"} <span class="kbd">Espace</span></button></div>`;
      CUR = { regieHint:hint, onKey:(k)=>{ if(k===" "||k==="Enter") nx(); } };
      const nx = () => { r++; intro(); };
      $("#dnx").onclick = nx;
      refreshRegie();
    }
  };
  intro();
};

/* ---- Finale : le Coup de tampon ---- */
RUN.finale = function(){
  const before = G.teams.map(t=>t.pts);
  const lead = G.teams[0].pts - G.teams[1].pts;
  const duel = [0,0]; if(lead !== 0){ duel[lead > 0 ? 0 : 1] = Math.abs(lead) >= 10 ? 2 : 1; }
  const qs = pickQ(14, true, {allLevels:true}); let i = 0;
  const show = () => {
    const q = qs[i % qs.length]; let hand = null, tried = [false,false], answered = false;
    CUR = { q,
      onBuzz:(t)=>{ if(hand === null && !answered && !tried[t]) take(t); },
      onKey:(k)=>{ if(k==="v" && hand !== null) judge(true); else if(k==="x" && hand !== null) judge(false); else if(k===" " && (answered || hand === null)) { answered ? next() : reveal(); } } };
    render(`${topbar("Le Coup de tampon · finale")}
    <div class="duel">${[0,1].map(t=>`<div class="lane t${t}" id="ln${t}">${avatar(t,44)}<strong style="font-size:clamp(15px,1.6vw,20px)">${esc(G.teams[t].name)}</strong><span class="pips">${[0,1,2,3,4].map(p=>`<span class="pip ${p<duel[t]?"on":""}"></span>`).join("")}</span></div>`).join("")}</div>
    <div class="qcard grow">
      <div class="qmeta"><span>Question ${i+1} · niveau ${q.n||1}</span><span class="timer" id="timer"></span></div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="answers">${q.o.map((o,j)=>`<div class="ans c${j}" id="an${j}"><span class="let">${LETTERS[j]}</span><span>${esc(o)}</span></div>`).join("")}</div>
      <p class="hand" id="hand">Buzzez ! <span class="kbd">A</span> ou <span class="kbd">P</span></p>
      <p class="expl" id="fexp"></p>
    </div>
    <div class="row" style="justify-content:center" id="fctl"><button class="btn" id="fskip">Personne ne trouve : révéler <span class="kbd">Espace</span></button></div>`);
    $("#fskip").onclick = reveal;
    startTimer(20, () => { if(hand === null) reveal(); });
    function take(t){
      hand = t; stopTimer(); SFX.buzz(t);
      $("#ln"+t).classList.add("buzz");
      $("#hand").innerHTML = `<span class="${TCLS[t]}">${esc(G.teams[t].name)} a la main !</span>`;
      $("#fctl").innerHTML = `<button class="btn ok big" id="fv">Bonne réponse <span class="kbd">V</span></button><button class="btn no big" id="fx">Mauvaise <span class="kbd">X</span></button>`;
      $("#fv").onclick = () => judge(true); $("#fx").onclick = () => judge(false);
      startTimer(10, () => judge(false));
      refreshRegie();
    }
    function judge(ok){
      const t = hand; if(t === null) return; stopTimer(); $("#ln"+t).classList.remove("buzz"); hand = null; tried[t] = true;
      if(ok){
        duel[t]++; SFX.good(); answered = true;
        $("#hand").innerHTML = `<span class="${TCLS[t]}">Bonne réponse ! Un point pour ${esc(G.teams[t].name)}</span>`;
        reveal(true);
        if(duel[t] >= 5){ CUR = null; $("#fctl").innerHTML = ""; setTimeout(() => win(t), 1100); return; }
      } else {
        SFX.bad();
        if(!tried[1-t]){ $("#hand").innerHTML = `Raté ! La main passe à <span class="${TCLS[1-t]}">${esc(G.teams[1-t].name)}</span>`; take(1-t); }
        else reveal();
      }
    }
    function reveal(silent){
      answered = true; stopTimer(); if(!silent) SFX.blip();
      q.o.forEach((_,j)=>$("#an"+j).classList.add(j===q.c?"good":"dim"));
      [0,1].forEach(t => $("#ln"+t).querySelectorAll(".pip").forEach((p,k)=>p.classList.toggle("on", k < duel[t])));
      $("#fexp").textContent = q.e || "";
      if(!silent) $("#hand").textContent = "Réponse :";
      $("#fctl").innerHTML = `<button class="btn big pink" id="fn">Question suivante <span class="kbd">Espace</span></button>`;
      $("#fn").onclick = next;
      refreshRegie();
    }
    function next(){ i++; show(); }
    refreshRegie();
  };
  function win(t){
    G.winner = t; addPts(t, 0);
    CUR = { onKey:(k)=>{ if(k===" "||k==="Enter") endGame(before); } };
    render(`<div class="grow center" style="gap:30px">
      <h2 class="${TCLS[t]}" style="font-size:clamp(28px,4vw,52px)">${esc(G.teams[t].name)}, au tampon !</h2>
      <div class="bounce">${avatar(t,120)}</div>
      <div id="stz" style="min-height:clamp(120px,22vw,300px);display:flex;align-items:center"><button class="btn big pink" id="tamp">Tamponner le PV</button></div>
    </div>`);
    $("#tamp").onclick = () => {
      SFX.stamp(); $("#stz").innerHTML = '<div class="stamp">Avis<br>favorable !</div>';
      setTimeout(SFX.fanfare, 500);
      setTimeout(() => { const b = document.createElement("button"); b.className = "btn big cyan"; b.textContent = "Voir le podium"; b.onclick = () => endGame(before); $("#app .center").appendChild(b); }, 1200);
    };
  }
  show();
};

    <div><h3>Raccourcis</h3><div class="keys"><span class="kbd">A</span><span>Buzzer équipe 1</span><span class="kbd">P</span><span>Buzzer équipe 2</span><span class="kbd">V</span><span>Bonne réponse / mot trouvé</span><span class="kbd">X</span><span>Mauvaise réponse</span><span class="kbd">S</span><span>Passer (Tabou)</span><span class="kbd">Espace</span><span>Révéler / continuer</span></div></div>

  r.querySelectorAll("[data-adj]").forEach(b => b.onclick = () => { const [t,d] = b.dataset.adj.split("|").map(Number); addPts(t, d); });
}

const ACT = {
  home:()=>{ $("#regie").hidden = true; screenTitle(); },
  preset:()=>{ G.plan = PRESET.slice(); G.saboteur = true; G.themes = []; G.level = "ca"; screenTeams(); },
  compose:screenCompose, toteams:()=>{ if(!G.plan.length){ return; } screenTeams(); },
  bank:screenBank, kit:screenKit,
  resetbank:()=>{ if(TOURNEE){ BANK = TOURNEE; BANK_SRC = "tournee"; } else { BANK = DEMO_Q.map((r,i)=>({id:"d"+i,t:r[0],n:r[1],q:r[2],o:r[3],c:0,e:r[4]})); BANK_SRC = "demo"; } G.used = []; try{ localStorage.removeItem("af-bank"); }catch(e){} screenBank(); },
  start:()=>{ G.step = 0; G.teams.forEach(t=>t.pts=0); G.winner = null; SFX.go(); screenBoard(); },
  launch, board:()=>{ $("#regie").hidden = true; screenBoard(); },
  skip:()=>{ $("#regie").hidden = true; if(G.step < G.plan.length){ G.step++; } screenBoard(); },
  again:()=>{ G.step = 0; G.teams.forEach(t=>t.pts=0); G.winner = null; G.used = []; screenBoard(); },
  newgame:()=>{ G = freshGame(); screenTitle(); },
  regie:()=>{ const r = $("#regie"); r.hidden = !r.hidden; refreshRegie(); },
  sound:()=>{ SOUND = !SOUND; const b = $("#sndbtn"); if(b) b.textContent = SOUND ? "Son : oui" : "Son : non"; },
  full:()=>{ try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} }
};
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if(b && ACT[b.dataset.act]){ e.preventDefault(); ACT[b.dataset.act](); } });
function buzz(t){ if(CUR && CUR.onBuzz) CUR.onBuzz(t); }
document.addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("input,select,textarea")) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if(k === "a" || k === "q"){ e.preventDefault(); return buzz(0); }
  if(k === "p" || k === "m"){ e.preventDefault(); return buzz(1); }
  if(k === "r"){ return ACT.regie(); }
  if(CUR && CUR.onKey && ["v","x","s"," ","Enter"].includes(k)){ e.preventDefault(); CUR.onKey(k); }
});
/* Manettes : manette 1 = équipe 1, manette 2 = équipe 2, n'importe quel bouton. */
const padPrev = [false,false];
(function poll(){
  try{
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const list = Array.from(pads || []).filter(Boolean);
    [0,1].forEach(t => { const p = list[t]; const down = !!(p && p.buttons.some(b => b.pressed)); if(down && !padPrev[t]) buzz(t); padPrev[t] = down; });
  }catch(e){}
  requestAnimationFrame(poll);
})();

/* Démarrage (et reprise après mise à jour de la page) */
function boot(data){
  if(data && data.G){ G = data.G; screenBoard(); } else screenTitle();
}
window.claude?.hot?.snapshot?.(() => ({ G }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
loadTournee();
</script>
